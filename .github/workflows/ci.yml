name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: "Навык по закреплённому коммиту (сквозная проверка)"
        run: |
          git init -q /tmp/landform
          git -C /tmp/landform remote add origin https://github.com/Osmosy/vector-fengshui-bazi.git
          git -C /tmp/landform fetch -q --depth 1 origin "$(cat tests/skill_pin.txt)"
          git -C /tmp/landform checkout -q FETCH_HEAD
      - name: "Тесты: офлайн, без сети и без кеша DEM"
        env:
          LANDFORM_REPO: /tmp/landform
        run: pytest -q -m "not network"
      - name: Инварианты пакетов примеров
        run: |
          for f in examples/*/site_pack.json; do
            echo "→ $f"
            geosite validate "$f" || exit 1
          done
      - name: "Правка расчёта требует CHANGELOG-CALC"
        run: bash scripts/ci_calc_changelog.sh

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: "Эталоны: офлайн, только фикстуры"
        run: pytest -q tests/test_golden.py
      - name: "Эталоны: причины пропусков и xfail"
        run: |
          pytest -q tests/test_golden.py -rsx 2>&1 | tee /tmp/golden.log
          grep -E "SKIPPED|XFAIL" /tmp/golden.log || true
