[project]
name = "vector-geo-site"
version = "0.1.0"
description = "Геоданные местности для фэншуй-интерпретации: рельеф, вода, ориентация — измерение без оценок"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "pydantic>=2.9",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vector = ["shapely>=2.0", "geopandas>=1.0", "osmnx>=2.0"]

[project.scripts]
geosite = "geosite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
