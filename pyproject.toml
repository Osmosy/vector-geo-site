[project]
name = "vector-geo-site"
version = "0.1.0"
description = "Геоданные местности для фэншуй-интерпретации: рельеф, вода, ориентация — измерение без оценок"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "pydantic>=2.9",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "pyshp>=2.3",
    "pygeomag>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vector = ["shapely>=2.0", "geopandas>=1.0", "osmnx>=2.0"]

[project.scripts]
geosite = "geosite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: тесты, которым нужен интернет",
    "skill: сквозная проверка навыка vector-fengshui-bazi по закреплённому коммиту",
]
addopts = "-m \"not network\""
# S5: RuntimeWarning из кода пакета — падение, а не шум в логах (nanmean по пустой выборке
# раньше печатался 81 раз и прятал настоящие предупреждения)
filterwarnings = ["error::RuntimeWarning:geosite"]
