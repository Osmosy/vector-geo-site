# kyoto-imperial-palace: S4 — классическое место. Котловина Ямасиро, восточные горы Хигасияма.
#
# Рельеф — с карты: `terrain.ring_max` называет вершину, высоту, расстояние и азимут из OSM
# (`natural=peak`, запрос 27.11.2026). ТЗ Б4: ожидание не списывается с вывода кода.
world:
  grid:
    kind: utm
  noon:
    north_days_max: 0
    south_days_min: 365
  sea:
    present: false
    min_kinds: 0
    source: 'OSM: моря нет ни в 8, ни в 15 км — Киото внутри острова Хонсю. Запрос 27.11.2026 (S2/E-038)'
    wc_share: 0.0068
    osm_water_share: 0.0374
  water:
    count_min: 3
    named_min: 2
  terrain:
    ring_max:
      - ring: [2.0, 8.0]
        mountain: 寅
        min: 600
        from: '比叡山 848 м, 7.96 км, 56° — OSM natural=peak 848.1'
      - ring: [2.0, 8.0]
        mountain: 卯
        min: 270
        from: '善気山 271 м, 3.64 км, 93° — OSM natural=peak 1242813050'
      - ring: [2.0, 8.0]
        mountain: 辛
        min: 150
        from: '衣笠山 201 м, 3.84 км, 288° — OSM natural=peak 5743446177'
      - ring: [2.0, 8.0]
        mountain: 午
        max: 100
        from: 'к югу в 9 км ни одной вершины с отметкой выше 100 м над участком — OSM natural=peak'
source:
  - 'Япония, Киото, Императорский дворец; фасад на восток, к реке Камо'
  - 'Котловина Ямасиро по карте (OSM natural=peak, 27.11.2026): на северо-востоке 比叡山 848 м в 8.0 км (56°), на востоке 善気山 271 м в 3.6 км (93°) и 一乗寺山 272 м в 4.1 км (64°), на западе 衣笠山 201 м в 3.8 км (288°); к югу вершин выше 100 м над участком в 9 км нет — равнина'
  - 'Вода ближе всего в 77 м — ручьи сада; пруд 近衛池 в 281 м к северу (OSM, блок water пакета). Отрезки 鴨川 с именем в фикстуре начинаются в 5.0 км, ближний участок размечен без имени — поэтому Камо в ожиданиях не утверждается'
