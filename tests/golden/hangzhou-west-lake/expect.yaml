# hangzhou-west-lake: S4 — классическое место. Западное озеро как 明堂.
#
# Рельеф берётся с карты: каждая строка `terrain.ring_max` называет вершину, её высоту,
# расстояние и азимут из OSM (`natural=peak`, запрос 27.11.2026), а не число из вывода кода.
# ТЗ Б4: эталон, списанный с расчёта, никогда не упадёт.
world:
  grid:
    kind: aeqd
    reason: zone_boundary
  noon:
    north_days_max: 0
    south_days_min: 365
  sea:
    present: false
    min_kinds: 0
    source: 'OSM: моря нет; 39.8 % воды по снимку — это Западное озеро, OSM объясняет 39.8 % внутренними водами. Карта OSM, запрос 27.11.2026 (S2/E-038)'
    wc_share: 0.3977
    osm_water_share: 0.398
  water:
    count_min: 3
    named_min: 2
  terrain:
    ring_max:
      - ring: [0.5, 2.0]
        mountain: 丙
        min: 90
        from: '九华山 116 м, 1.79 км, 169° — OSM natural=peak 4944269341'
      - ring: [2.0, 8.0]
        mountain: 午
        min: 130
        from: '凤凰山 174 м, 2.13 км, 172° (на границе 丙/午) — OSM natural=peak 4944239421'
      - ring: [2.0, 8.0]
        mountain: 坤
        min: 200
        from: '玉皇山 240 м, 3.07 км, 201° — OSM natural=peak 4943773762'
      - ring: [2.0, 8.0]
        mountain: 酉
        min: 250
        from: '北高峰 313 м, 5.75 км, 276° — OSM natural=peak, запрос 27.11.2026'
      - ring: [2.0, 8.0]
        mountain: 子
        max: 100
        from: 'к северу ближайшая вершина — 宝石山 78 м в 2.4 км (336°); выше 60 м над участком вершин нет — OSM natural=peak/hill'
source:
  - 'Китай, Чжэцзян, Ханчжоу; точка на юго-восточном берегу Западного озера, фасад на запад — озеро как 明堂'
  - 'Рельеф по карте (OSM natural=peak, 27.11.2026): за спиной 吴山 74 м в 0.90 км (117°) и 云居山 98 м в 1.06 км (148°); к югу 凤凰山 174 м в 2.1 км (172°) и 玉皇山 240 м в 3.1 км (201°); к северу 宝石山 78 м в 2.4 км (336°); за озером 南高峰 257 м в 3.9 км (238°) и 北高峰 313 м в 5.8 км (276°)'
  - 'Классическая формула 三面云山一面城 (три стороны — облачные горы, одна — город) описывает котловину озера в целом: горы на севере, западе и юге, город на востоке. К этой точке она не относится — холмы стоят за спиной и по бокам, озеро впереди, поэтому формула в ожиданиях не утверждается (правка ревью 27.11.2026)'
  - '明堂 озера: вода занимает 39.8 % кольца 0.5–2 км, ближайший берег озера 西湖 — 76 м (блок water пакета)'
