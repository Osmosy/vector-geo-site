# Факты для Лондона, Сити. Каждый — с источником; подгонять под код запрещено (ТЗ Б4).
water:
  "River Thames":
    order: 5
    nearest_m_range: [150, 900]        # Темза в 0.5 км от Сити: карта OSM + прогулка по набережной
    bend: outer                        # участок на внешнем берегу изгиба (反弓): карта
    bend_kind: loop                    # петля Айл-оф-Догс в 3–4 км восточнее: карта OSM
    loop: present
    site_position: outside_concave     # участок снаружи со стороны перешейка, не 反弓
    tidal: true                        # ниже шлюза Теддингтон: PLA, tidal_limits.json
    flow_chosen: downstream_toward_end # Темза течёт на восток через Лондон
    in_mountain_any: [坤, 申]           # вход воды с юго-запада (выше по течению)
    out_mountain_any: [辰, 乙, 巽, 卯]  # выход на восток (ниже по течению)
    confluences_min: 1                 # слияние с Флитом (устье у Блэкфрайерс)
water_mouth:
  width_capped: true                   # лондонская котловина: борт не поднимается на 20 м
hydrorivers:
  order: 5
  discharge_m3s_range: [80, 100]
  distance_max_m: 600          # участок HydroRIVERS смещён от русла OSM на 374 м: сеть 15″
source:
  - "OSM: теги waterway/natural на Темзе, слияние с River Fleet"
  - "tidal_limits.json: граница прилива — Teddington Lock (Port of London Authority)"
  - "Copernicus GLO-30 (DSM), профиль бортов долины в 8 км от Сити"

climate:
  declination_deg_range: [0.5, 2.0]   # WMM на 2026.9: +1.24° на восток (NOAA)
  wind_prevailing_range: [215, 255]   # ERA5 2016–2025: юго-запад, 235.8°
  wind_mountain_any: [申, 坤]
  wind_speed_ms_range: [3.0, 5.0]     # 3.97 м/с на 10 м
  wind_days_min: 3600                 # десять лет суточных данных
