# Москва, Кремль: Москва-река и скрытая Неглинная в трубе.
# Выгрузка получена 23.11.2026 с зеркала maps.mail.ru: overpass-api.de отдавал 502, а
# overpass.osm.ch (только Швейцария) — честный ноль, который принимался за отсутствие воды.
water:
  "Москва":
    order: 5
    nearest_m_range: [150, 900]        # Кремль стоит на левом берегу
    flow_chosen: downstream_toward_end # Москва-река течёт на юго-восток
    loop: present                      # Балчуг: русло обходит остров и возвращается (ratio 4.65)
    site_position: outside_concave     # Кремль снаружи вогнутой стороны петли
    confluences_min: 1                 # Яуза ниже Кремля
  "Неглинная":
    nearest_m_range: [100, 2500]       # Неглинная убрана в трубу под Александровским садом
    hidden_share_min: 0.9              # в коллекторе почти на всей длине
    visible: false                     # 暗水, а не поверхностная река
status: pass
hydrorivers:
  order: 5                     # Москва-река: 57 м3/с
  discharge_m3s_range: [30, 80]
  distance_max_m: 2200
source:
  - "Карта: Москва-река у Кремля, устье Неглинной у Большого Каменного моста"
  - "Известно: Неглинная заключена в коллектор в 1819–1887 гг."
  - "OSM: отношение Москвы-реки и куски Неглинной с tunnel=culvert"
